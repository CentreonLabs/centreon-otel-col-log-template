# Title: HPC cluster
# Description: The HPC cluster (mmcs) node event log.
#
# The source has no severity field: the fourth column is an event category (e.g.
# 'temperature', 'status'), not a level, and tokens like 'critical'/'warning'
# appear only inside message bodies (temperature readings), so no severity is
# mapped and records carry no severityText. The include path is an assumption,
# confirm the file location on the target host. Timestamps are epoch seconds,
# hence timezone-independent. The leading log-id sequence number and the 0/1 flag
# column are parsed but intentionally dropped (no documented meaning).

receivers:
  filelog/hpc:
    include:
      - /var/log/hpc.log
    include_file_path: true
    operators:
      # Single space-separated event format: <log-id> <node> <component> <event-state> <epoch-seconds> <flag> <message>. Every line in the reference logs follows it; the log-id and flag fields are captured positionally but dropped (meaning undocumented).
      - type: regex_parser
        regex: ^(?P<id>\d+)\s+(?P<node>\S+)\s+(?P<component>\S+)\s+(?P<state>\S+)\s+(?P<ts>\d+)\s+(?P<flag>\d+)\s+(?P<body>.*)$
        # Fifth field is a Unix epoch timestamp in whole seconds (e.g. 1077804742 = Feb 2004 UTC); the source carries no sub-second precision and no offset.
        timestamp:
          parse_from: attributes.ts
          layout_type: epoch
          layout: s
      - type: move
        from: attributes["body"]
        to: body
      # Reporting node/device name (compute node-*, gige* switches, Interconnect-*, or 'full' for partition-wide events).
      - type: move
        from: attributes["node"]
        to: attributes["host.name"]
      # Subsystem that raised the event (unix.hw, clusterfilesystem, switch_module, node, gige, partition, action); no semconv attribute covers a log-source subsystem/facility.
      - type: move
        from: attributes["component"]
        to: attributes["custom.hpc.component"]
      # Event category/state token (state_change.unavailable, temperature, status, error, fdmn.panic, ...); values do not fit the hw.state enum, so a custom name is used.
      - type: move
        from: attributes["state"]
        to: attributes["custom.hpc.state"]
      # The pack version — bump when the pack changes
      - type: add
        field: resource["service.version"]
        value: 1.0.0
      # service.name is the resource identity Pulse filters on
      - type: add
        field: resource["service.name"]
        value: hpc
      # Drop the temp captures consumed by the parsing blocks above
      - type: remove
        field: attributes["flag"]
      - type: remove
        field: attributes["id"]
      - type: remove
        field: attributes["ts"]
# Wire the receiver into the fixed production pipeline (the processors
# and the otlphttp/centreon exporter are defined by the base config).
service:
  pipelines:
    logs/hpc:
      receivers:
        - filelog/hpc
      processors:
        - memory_limiter
        - resourcedetection
        - batch
      exporters:
        - otlphttp/centreon
