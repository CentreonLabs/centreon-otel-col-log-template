# Log pack for 'zookeeper' — generated by the otel-log-pack skill
# (rendered from a decision payload).
# Do not hand-edit: change the decision payload and re-render with
# scripts/render.py so the validation gates run again.
# Notes: The sample contains one single-line ZooKeeper Log4j format.
# Timestamps without offsets are interpreted as UTC. The target include glob
# assumes the conventional /var/log/zookeeper directory.
receivers:
  filelog/zookeeper:
    include:
      - /var/log/zookeeper/*.log
    include_file_path: true
    operators:
      # Matches ZooKeeper's Log4j-style timestamp, severity, thread context, logger class and source line before the message body.
      - type: regex_parser
        regex: ^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<level>INFO|WARN|ERROR)\s+\[(?P<thread>.*):(?P<logger>[^:@]+)@(?P<line>\d+)\] - (?P<body>.*)$
        # The sample uses a four-digit date, 24-hour time and comma-delimited milliseconds without an offset; the configured source timezone is UTC.
        timestamp:
          parse_from: attributes.ts
          layout_type: strptime
          layout: '%Y-%m-%d %H:%M:%S,%L'
        # INFO -> INFO: INFO marks routine ZooKeeper connection, session and processing events in the sample.
        # WARN -> WARN: WARN marks degraded connection and worker conditions in the sample without asserting process failure.
        # ERROR -> ERROR: ERROR explicitly marks unexpected exceptions causing ZooKeeper handler shutdowns in the sample.
        severity:
          parse_from: attributes.level
          mapping:
            info: INFO
            warn: WARN
            error: ERROR
      - type: move
        from: attributes["body"]
        to: body
      # The bracket prefix identifies the Java execution thread or ZooKeeper worker context.
      - type: move
        from: attributes["thread"]
        to: attributes["thread.name"]
      # The value after the final thread-context colon is ZooKeeper's emitting Java logger or class; the pinned semantic conventions have no logger-name attribute.
      - type: move
        from: attributes["logger"]
        to: attributes["custom.logger.name"]
      # The decimal value after @ is the source-code line emitted by the logging pattern.
      - type: move
        from: attributes["line"]
        to: attributes["code.line.number"]
      # The pack version — bump when the pack changes
      - type: add
        field: resource["service.version"]
        value: 1.0.0
      # service.name is the resource identity Pulse filters on
      - type: add
        field: resource["service.name"]
        value: zookeeper
      # Drop the temp captures consumed by the parsing blocks above
      - type: remove
        field: attributes["level"]
      - type: remove
        field: attributes["ts"]
# Wire the receiver into the fixed production pipeline (the processors
# and the otlphttp/centreon exporter are defined by the base config).
service:
  pipelines:
    logs/zookeeper:
      receivers:
        - filelog/zookeeper
      processors:
        - memory_limiter
        - resourcedetection
        - batch
      exporters:
        - otlphttp/centreon
