# Log pack for 'healthapp' — generated by the otel-log-pack skill
# (rendered from a decision payload).
# Do not hand-edit: change the decision payload and re-render with
# scripts/render.py so the validation gates run again.
# Notes: No severity field exists in this format (every line is plain
# operational output), so the severity block is omitted per the mapping rules;
# records will carry no severityText. Millisecond precision is dropped: the
# ':'-separated milliseconds cannot be expressed in the collector's timestamp
# dialects. The include path /var/log/healthapp/*.log is a placeholder — the
# real path on the target host was not confirmed.
receivers:
  filelog/healthapp:
    include:
      - /var/log/healthapp/*.log
    include_file_path: true
    operators:
      # Android HealthApp pipe-delimited line: <yyyymmdd-H:M:S:ms>|<component tag>|<pid>|<message>. Hours/minutes/seconds are NOT zero-padded (e.g. 20171224-0:0:0:223), hence \d{1,2}. The trailing :\d{1,3} is the millisecond field, matched but not captured (see timestamp comment).
      - type: regex_parser
        regex: ^(?P<ts>\d{8}-\d{1,2}:\d{1,2}:\d{1,2}):\d{1,3}\|(?P<component>[^|]+)\|(?P<pid>\d+)\|(?P<body>.*)$
        # gotime because the time fields are unpadded (0:0:0) and strptime %M/%S only accept zero-padded values; Go tokens 15/4/5 accept 1-2 digits. The colon-separated millisecond suffix (:606) is not expressible in either dialect, so the capture stops at seconds — sub-second precision is intentionally dropped. Timestamps carry no offset; parsed as UTC.
        timestamp:
          parse_from: attributes.ts
          layout_type: gotime
          layout: 20060102-15:4:5
      - type: move
        from: attributes["body"]
        to: body
      # Application component/logger tag (Step_LSC, Step_SPUtils, HiH_DataStatManager, ...). No official semconv attribute covers a logger tag in the pinned registry, hence custom.*.
      - type: move
        from: attributes["component"]
        to: attributes["custom.component"]
      # Third pipe-delimited field is the numeric process id emitting the line (constant 30002312 in the sample).
      - type: move
        from: attributes["pid"]
        to: attributes["process.pid"]
      # The pack version — bump when the pack changes
      - type: add
        field: resource["service.version"]
        value: 1.0.0
      # service.name is the resource identity Pulse filters on
      - type: add
        field: resource["service.name"]
        value: healthapp
      # Drop the temp captures consumed by the parsing blocks above
      - type: remove
        field: attributes["ts"]
# Wire the receiver into the fixed production pipeline (the processors
# and the otlphttp/centreon exporter are defined by the base config).
service:
  pipelines:
    logs/healthapp:
      receivers:
        - filelog/healthapp
      processors:
        - memory_limiter
        - resourcedetection
        - batch
      exporters:
        - otlphttp/centreon
