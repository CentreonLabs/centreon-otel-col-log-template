# Log pack for 'bgl-ras' — generated by the otel-log-pack skill
# (rendered from a decision payload).
# Do not hand-edit: change the decision payload and re-render with
# scripts/render.py so the validation gates run again.
# Notes: Include path /var/log/bgl/bgl.log is a placeholder - set it to the
# RAS log path on the target host. The record timestamp comes from the epoch-
# seconds field, so sub-second precision from the wall-clock field
# (microseconds) is not preserved; that field carries no UTC offset (assumed
# UTC) and the payload cannot pin a timezone, so the epoch field is the safe
# choice. Sample is single-format; no multiline events observed. No holdout
# file was available for this run.
receivers:
  filelog/bgl-ras:
    include:
      - /var/log/bgl/bgl.log
    include_file_path: true
    operators:
      # Blue Gene/L RAS event log, one event per line: <alert_tag> <epoch> <date> <node> <datetime> <node> <message_type> <component> <severity> <message>. The date (redundant with the timestamps) and the repeated node field are matched unnamed and discarded; 'NULL' is a legitimate value for node and message_type, so both stay \S+.
      - type: regex_parser
        regex: ^(?P<alert_tag>\S+) (?P<epoch>\d+) \d{4}\.\d{2}\.\d{2} (?P<node>\S+) (?P<ts>\d{4}-\d{2}-\d{2}-\d{2}\.\d{2}\.\d{2}\.\d{6}) \S+ (?P<message_type>\S+) (?P<component>\S+) (?P<level>[A-Z]+) (?P<body>.*)$
        # Each line carries both an epoch-seconds field and a human-readable timestamp (2005-06-03-15.42.50.675872) with no UTC offset. The epoch field is parsed because it is unambiguously UTC on any host; the microsecond-precision wall-clock field would be interpreted in the collector host's local timezone.
        timestamp:
          parse_from: attributes.epoch
          layout_type: epoch
          layout: s
        # INFO -> INFO: Routine informational RAS events in the sample: corrected cache parity errors, core-file generation notices, interrupt statistics.
        # WARNING -> WARN: Canonical WARNING -> WARN folding; sample lines report degraded-but-running conditions ('Node card is not fully functional', service-action shutdown notices).
        # ERROR -> ERROR: Sample ERROR lines are failed operations in the control system (idoproxydb hit ASSERT condition in IdoTransportMgr::SendPacket) without declared process/node death.
        # FATAL -> FATAL: BGL marks unrecoverable, job/node-killing events FATAL: data TLB error interrupt, machine check, ciod failing to read the control stream or load the program image.
        severity:
          parse_from: attributes.level
          mapping:
            info: INFO
            warn: WARNING
            error: ERROR
            fatal: FATAL
      - type: move
        from: attributes["body"]
        to: body
      # BGL location code of the reporting node (e.g. R02-M1-N0-C:J12-U11) - the node identity in this system, closest semconv concept is host.name. Literal 'NULL' appears when no node is associated.
      - type: move
        from: attributes["node"]
        to: attributes["host.name"]
      # First field: the alert category tag assigned by the RAS system (e.g. APPREAD, KERNDTLB); '-' means the event carries no alert category. No semconv attribute covers alert taxonomies.
      - type: move
        from: attributes["alert_tag"]
        to: attributes["custom.alert_tag"]
      # RAS event class (RAS, or NULL for non-RAS records such as DISCOVERY/HARDWARE notices). BGL-specific taxonomy, no semconv fit.
      - type: move
        from: attributes["message_type"]
        to: attributes["custom.message_type"]
      # Subsystem that produced the event (KERNEL, APP, DISCOVERY, MMCS, HARDWARE). BGL-specific facility field, no semconv fit.
      - type: move
        from: attributes["component"]
        to: attributes["custom.component"]
      # The pack version — bump when the pack changes
      - type: add
        field: resource["service.version"]
        value: 1.0.0
      # service.name is the resource identity Pulse filters on
      - type: add
        field: resource["service.name"]
        value: bgl-ras
      # Drop the temp captures consumed by the parsing blocks above
      - type: remove
        field: attributes["epoch"]
      - type: remove
        field: attributes["level"]
      - type: remove
        field: attributes["ts"]
# Wire the receiver into the fixed production pipeline (the processors
# and the otlphttp/centreon exporter are defined by the base config).
service:
  pipelines:
    logs/bgl-ras:
      receivers:
        - filelog/bgl-ras
      processors:
        - memory_limiter
        - resourcedetection
        - batch
      exporters:
        - otlphttp/centreon
