# macOS system log (BSD syslog format).
# The format carries no severity token, so no severity is mapped (severity is
# never synthesized from body keywords). Timestamps have no year (the collector
# fills in the current year) and no UTC offset (assumed UTC). Lines without a
# bracketed pid still parse; the pid move then logs a per-line operator error but
# the record flows on.

receivers:
  filelog/macos-system-log:
    include:
      - /var/log/system.log
    include_file_path: true
    operators:
      # macOS system.log in BSD syslog framing: 'Jul  1 09:00:55 host process[pid]: message'. The process tag is non-greedy because macOS tags contain dots (com.apple.CDScheduler) and spaces (Microsoft Word); the optional bracketed pid may be followed by a parenthesized launchd job label (e.g. com.apple.xpc.launchd[1] (com.apple...)), which is framing noise and is not captured.
      - type: regex_parser
        regex: ^(?P<ts>\w{3}\s+\d{1,2}\s\d{2}:\d{2}:\d{2})\s(?P<hostname>\S+)\s(?P<process>.*?)(?:\[(?P<pid>\d+)\])?(?:\s\([^)]*\))?:\s(?P<body>.*)$
        # Classic syslog timestamp with no year and no UTC offset; the day is space-padded (Jul  1), so %e, not %d. The collector fills in the current year, and times are treated as UTC (confirmed source convention).
        timestamp:
          parse_from: attributes.ts
          layout_type: strptime
          layout: '%b %e %H:%M:%S'
      - type: move
        from: attributes["body"]
        to: body
      # The syslog process tag (executable, bundle id, or launchd label that emitted the line).
      - type: move
        from: attributes["process"]
        to: attributes["process.executable.name"]
      # The bracketed pid of the emitting process.
      - type: move
        from: attributes["pid"]
        to: attributes["process.pid"]
      # Hostname as written on the log line, kept because it may differ from the collector host detected by resourcedetection (roaming laptop changes its name with the network).
      - type: move
        from: attributes["hostname"]
        to: attributes["host.name"]
      # The pack version — bump when the pack changes
      - type: add
        field: resource["service.version"]
        value: 1.0.0
      # service.name is the resource identity Pulse filters on
      - type: add
        field: resource["service.name"]
        value: macos-system-log
      # Drop the temp captures consumed by the parsing blocks above
      - type: remove
        field: attributes["ts"]
# Wire the receiver into the fixed production pipeline (the processors
# and the otlphttp/centreon exporter are defined by the base config).
service:
  pipelines:
    logs/macos-system-log:
      receivers:
        - filelog/macos-system-log
      processors:
        - memory_limiter
        - resourcedetection
        - batch
      exporters:
        - otlphttp/centreon
