# Log pack for 'proxifier' — generated by the otel-log-pack skill
# (rendered from a decision payload).
# Do not hand-edit: change the decision payload and re-render with
# scripts/render.py so the validation gates run again.
# Notes: The target-host log location was not supplied, so
# /var/log/proxifier.log is a deployment placeholder and must be adjusted if
# needed. Timestamps omit year and timezone; the current year is supplied by
# the collector and offset-free values are interpreted under the stated UTC
# assumption. Action-specific details, including proxy endpoints, transfer
# counts, and lifetimes, remain in the log body.
receivers:
  filelog/proxifier:
    include:
      - /var/log/proxifier.log
    include_file_path: true
    operators:
      # Matches Proxifier connection lifecycle lines, retaining the executable, destination endpoint, action token, and action-specific detail text.
      - type: regex_parser
        regex: '^\[(?P<ts>\d{2}\.\d{2} \d{2}:\d{2}:\d{2})\] (?P<process>[A-Za-z0-9_.-]+)(?: \*64)? - (?P<target_host>[^:[:space:]]+):(?P<target_port>\d+) (?P<level>open|close|error)(?P<body>.*)$'
        # The sample uses zero-padded month.day and 24-hour time without a year or offset; the collector supplies the current year, and this pack assumes UTC as specified for the source.
        timestamp:
          parse_from: attributes.ts
          layout_type: strptime
          layout: '%m.%d %H:%M:%S'
        # open -> INFO: The token records a normal connection-open lifecycle event in the sample.
        # close -> INFO: The token records a normal connection-close lifecycle event with transfer statistics.
        # error -> ERROR: The token accompanies explicit connection and proxy failure messages in the sample.
        severity:
          parse_from: attributes.level
          mapping:
            info:
              - open
              - close
            error: error
      - type: move
        from: attributes["body"]
        to: body
      # The capture is the Windows executable name initiating the proxied connection; the optional '*64' marker is excluded.
      - type: move
        from: attributes["process"]
        to: attributes["process.executable.name"]
      # The capture identifies the destination host or IP address the application attempted to reach.
      - type: move
        from: attributes["target_host"]
        to: attributes["server.address"]
      # The capture is the destination server port in the connection endpoint.
      - type: move
        from: attributes["target_port"]
        to: attributes["server.port"]
      # No applicable official semantic convention represents Proxifier's open, close, and error lifecycle action tokens, so the source-specific action uses custom.*.
      - type: move
        from: attributes["level"]
        to: attributes["custom.proxy.event.action"]
      # The pack version — bump when the pack changes
      - type: add
        field: resource["service.version"]
        value: 1.0.0
      # service.name is the resource identity Pulse filters on
      - type: add
        field: resource["service.name"]
        value: proxifier
      # Drop the temp captures consumed by the parsing blocks above
      - type: remove
        field: attributes["ts"]
# Wire the receiver into the fixed production pipeline (the processors
# and the otlphttp/centreon exporter are defined by the base config).
service:
  pipelines:
    logs/proxifier:
      receivers:
        - filelog/proxifier
      processors:
        - memory_limiter
        - resourcedetection
        - batch
      exporters:
        - otlphttp/centreon
