# Log pack for 'hdfs' — generated by the otel-log-pack skill
# (rendered from a decision payload).
# Do not hand-edit: change the decision payload and re-render with
# scripts/render.py so the validation gates run again.
# Notes: The sample contains the INFO and WARN severities only. Timestamps
# lack an offset and are interpreted as UTC. The target include glob assumes
# the common /var/log/hadoop-hdfs installation path.
receivers:
  filelog/hdfs:
    include:
      - /var/log/hadoop-hdfs/*.log
    include_file_path: true
    operators:
      # Matches the legacy Hadoop HDFS format: yyMMdd HHmmss, numeric thread identifier, severity, Java logger category, and message body.
      - type: regex_parser
        regex: ^(?P<ts>\d{6}\s+\d{6})\s+(?P<thread_id>\d+)\s+(?P<level>[A-Z]+)\s+(?P<logger>[A-Za-z0-9_.$]+):\s*(?P<body>.*)$
        # The sample uses a two-digit year followed by month, day, and a separate compact 24-hour time; timestamps have no offset and are treated as UTC.
        timestamp:
          parse_from: attributes.ts
          layout_type: strptime
          layout: '%y%m%d %H%M%S'
        # INFO -> INFO: INFO is the canonical informational token present in routine block lifecycle records in the sample.
        # WARN -> WARN: WARN is the canonical warning token present on DataXceiver exception records in the sample.
        severity:
          parse_from: attributes.level
          mapping:
            info: INFO
            warn: WARN
      - type: move
        from: attributes["body"]
        to: body
      # The numeric field between timestamp and severity identifies the emitting Hadoop thread and maps to the official thread.id convention.
      - type: move
        from: attributes["thread_id"]
        to: attributes["thread.id"]
      # The Java logger category, such as dfs.DataNode$DataXceiver, has no matching attribute in the pinned official registry, so it uses a Hadoop-specific custom namespace.
      - type: move
        from: attributes["logger"]
        to: attributes["custom.hadoop.logger"]
      # The pack version — bump when the pack changes
      - type: add
        field: resource["service.version"]
        value: 1.0.0
      # service.name is the resource identity Pulse filters on
      - type: add
        field: resource["service.name"]
        value: hdfs
      # Drop the temp captures consumed by the parsing blocks above
      - type: remove
        field: attributes["level"]
      - type: remove
        field: attributes["ts"]
# Wire the receiver into the fixed production pipeline (the processors
# and the otlphttp/centreon exporter are defined by the base config).
service:
  pipelines:
    logs/hdfs:
      receivers:
        - filelog/hdfs
      processors:
        - memory_limiter
        - resourcedetection
        - batch
      exporters:
        - otlphttp/centreon
